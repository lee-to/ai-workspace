[package]
name = "ai-workspace"
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Danil Shutsky <thecutcode@gmail.com>"]
description = "Cross-project shared context for AI coding agents via CLI and MCP server"
license = "MIT"
repository = "https://github.com/lee-to/ai-workspace"
homepage = "https://cutcode.dev"
readme = "README.md"
keywords = ["ai", "mcp", "workspace", "context", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ai-workspace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
dirs = "6"
anyhow = "1"
axum = "0.8"
ignore = "0.4"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
self_update = { version = "1.0.0-rc.6", default-features = false, features = ["archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "github", "ureq", "rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["timeout"] }
uuid = { version = "1", features = ["serde", "v4"] }
